<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pligter – overblik</title>
<meta name="theme-color" content="#2e7d32">
<link rel="icon" href="../icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --text: #1c2119; --muted: #646b60; --line: #e2e5de;
    --over-bg: #fbe4e2; --over-line: #8b1a1a;
    --sat-bg: 70%; --light-bg: 94%; --sat-line: 62%; --light-line: 40%;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121410; --card: #1b1e19; --text: #e7eae3; --muted: #9ba294; --line: #2c3029;
      --over-bg: #3a1714; --over-line: #e0574d;
      --sat-bg: 35%; --light-bg: 16%; --sat-line: 55%; --light-line: 50%;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -.5px; }
  .dato { color: var(--muted); font-size: 14px; }
  .opsummering { color: var(--muted); font-size: 14px; margin: 4px 0 16px; min-height: 20px; }
  .opsummering b { color: var(--text); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 24px 4px 8px; font-weight: 600; }
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .kort { --h: 120; background: hsl(var(--h) var(--sat-bg) var(--light-bg));
    border-left: 6px solid hsl(var(--h) var(--sat-line) var(--light-line));
    border-radius: 12px; box-shadow: var(--shadow); padding: 11px 14px; }
  .kort.over { background: var(--over-bg); border-left-color: var(--over-line); }
  .navn { font-weight: 650; font-size: 17px; overflow-wrap: anywhere; }
  .status { font-size: 14px; margin-top: 2px; font-weight: 550; color: hsl(var(--h) var(--sat-line) calc(var(--light-line) - 8%)); }
  @media (prefers-color-scheme: dark) { .status { color: hsl(var(--h) var(--sat-line) 65%); } }
  .kort.over .status { color: var(--over-line); }
  .meta { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .daglig { background: var(--card); border-radius: 12px; padding: 4px 14px; box-shadow: var(--shadow); }
  .daglig div { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .daglig div:last-child { border-bottom: 0; }
  .fod { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  .fejl { color: var(--over-line); text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pligter</h1>
    <span class="dato" id="idag"></span>
  </header>
  <p class="opsummering" id="opsummering">Henter …</p>
  <div class="liste" id="liste"></div>
  <div id="dagligBoks" style="display:none">
    <h2>Dagligt</h2>
    <div class="daglig" id="dagligListe"></div>
  </div>
  <p class="fod" id="fod">Kun visning · opdateres automatisk</p>
</div>

<script>
const SB_URL = "https://jmkicrzqmzbetzzjoqtd.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impta2ljcnpxbXpiZXR6empvcXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzY1NDUsImV4cCI6MjEwODExMjU0NX0.BHSSKBFBVZ0qESq-LFkUccpCFRsbhq50DQi4bxK6jx4";
const FREK_TEKST = { daglig: "Dagligt", "2dage": "Hver 2. dag", ugentlig: "Ugentligt", "14dage": "Hver 14. dag",
  maanedlig: "Månedligt", kvartal: "Kvartalsvis", halvaar: "Halvårligt", aarlig: "Årligt", engang: "Påmindelse" };
const MDR = ["jan.", "feb.", "mar.", "apr.", "maj", "jun.", "jul.", "aug.", "sep.", "okt.", "nov.", "dec."];
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function idagISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function fmtDato(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d}. ${MDR[m - 1]}` + (y !== new Date().getFullYear() ? ` ${y}` : "");
}
function dageTekst(n) { return n === 1 ? "1 dag" : `${n} dage`; }
function dageMellem(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000); }

function vurder(o) {
  const d = o.dage_til_forfald;
  if (o.frekvens === "engang") {
    const til = dageMellem(idagISO(), o.frist);
    const status = til < 0 ? `Datoen var ${fmtDato(o.frist)}` : til === 0 ? "Det er i dag"
      : til === 1 ? `I morgen · ${fmtDato(o.frist)}` : `Om ${dageTekst(til)} · ${fmtDato(o.frist)}`;
    if (d <= 0) return { over: true, hue: 0, status };
    const f = Math.min(1, Math.max(0, 1 - d / Math.max(1, o.interval_dage)));
    return { over: false, hue: Math.round(120 * (1 - f)), status };
  }
  if (o.sidste_dato == null) return { over: true, hue: 0, status: "Ikke registreret endnu" };
  if (d < 0) return { over: true, hue: 0, status: `Overskredet ${dageTekst(-d)}` };
  const f = Math.min(1, Math.max(0, 1 - d / Math.max(1, o.interval_dage)));
  const status = d === 0 ? "Forfalder i dag" : d === 1 ? "Forfalder i morgen" : `Forfalder om ${dageTekst(d)} · ${fmtDato(o.forfald)}`;
  return { over: false, hue: Math.round(120 * (1 - f)), status };
}
function erOver(o) {
  return o.frekvens === "engang" ? o.dage_til_forfald <= 0 : (o.sidste_dato == null || o.dage_til_forfald < 0);
}
function meta(o) {
  if (o.frekvens === "engang") return "Påmindelse";
  return [FREK_TEKST[o.frekvens], o.sidste_dato ? `Sidst ${fmtDato(o.sidste_dato)}` : null].filter(Boolean).join(" · ");
}

async function hent() {
  $("idag").textContent = fmtDato(idagISO());
  try {
    const res = await fetch(`${SB_URL}/rest/v1/rpc/pligt_overblik`, {
      method: "POST",
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
      body: "{}",
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    tegn(await res.json());
    $("fod").textContent = `Kun visning · opdateret ${new Date().toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    $("liste").innerHTML = '<div class="fejl">Kunne ikke hente overblikket lige nu.</div>';
    $("opsummering").textContent = "";
  }
}

function tegn(rows) {
  const liste = rows.filter((o) => o.frekvens !== "daglig")
    .sort((a, b) => (a.dage_til_forfald ?? -1e9) - (b.dage_til_forfald ?? -1e9) || a.navn.localeCompare(b.navn, "da"));
  const daglig = rows.filter((o) => o.frekvens === "daglig")
    .sort((a, b) => a.sortering - b.sortering || a.navn.localeCompare(b.navn, "da"));

  const over = liste.filter(erOver).length;
  const snart = liste.filter((o) => o.frekvens !== "engang" && !erOver(o) && o.dage_til_forfald <= o.varsel_dage).length;
  $("opsummering").innerHTML = over || snart
    ? [over ? `<b>${over}</b> skal gøres nu` : "", snart ? `<b>${snart}</b> forfalder snart` : ""].filter(Boolean).join(" · ")
    : "Alt er under kontrol 🌿";

  $("liste").innerHTML = liste.map((o) => {
    const v = vurder(o);
    return `<div class="kort${v.over ? " over" : ""}" style="--h:${v.hue}">
      <div class="navn">${esc(o.navn)}</div>
      <div class="status">${esc(v.status)}</div>
      <div class="meta">${esc(meta(o))}</div>
    </div>`;
  }).join("");

  $("dagligBoks").style.display = daglig.length ? "" : "none";
  $("dagligListe").innerHTML = daglig.map((o) => `<div>${esc(o.navn)}</div>`).join("");
}

hent();
setInterval(hent, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") hent(); });
</script>
</body>
</html>
