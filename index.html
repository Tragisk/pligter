<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pligter</title>
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pligter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --text: #1c2119; --muted: #646b60; --line: #e2e5de;
    --accent: #2e7d32; --accent-text: #ffffff; --danger: #b3261e; --over-bg: #fbe4e2; --over-line: #8b1a1a;
    --sat-bg: 70%; --light-bg: 94%; --sat-line: 62%; --light-line: 40%;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121410; --card: #1b1e19; --text: #e7eae3; --muted: #9ba294; --line: #2c3029;
      --accent: #5cb860; --accent-text: #0c1a0c; --danger: #ff8a80; --over-bg: #3a1714; --over-line: #e0574d;
      --sat-bg: 35%; --light-bg: 16%; --sat-line: 55%; --light-line: 50%;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 16px; }
  .hidden { display: none !important; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 4px; }
  header.top h1 { font-size: 28px; margin: 0; letter-spacing: -.5px; }
  .dato { color: var(--muted); font-size: 14px; }
  .opsummering { color: var(--muted); font-size: 14px; margin: 0 0 14px; min-height: 20px; }
  .opsummering b { color: var(--text); }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 24px 4px 8px; font-weight: 600; }

  /* Opgavekort */
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .kort { --h: 120; background: hsl(var(--h) var(--sat-bg) var(--light-bg));
    border-left: 6px solid hsl(var(--h) var(--sat-line) var(--light-line));
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .kort.over { background: var(--over-bg); border-left-color: var(--over-line); }
  .kort-top { display: flex; align-items: center; gap: 10px; padding: 12px 10px 12px 14px; }
  .kort-tekst { flex: 1; min-width: 0; cursor: pointer; }
  .kort-navn { font-weight: 650; font-size: 17px; overflow-wrap: anywhere; }
  .kort-status { font-size: 14px; margin-top: 2px; color: hsl(var(--h) var(--sat-line) calc(var(--light-line) - 8%)); font-weight: 550; }
  @media (prefers-color-scheme: dark) { .kort-status { color: hsl(var(--h) var(--sat-line) 65%); } }
  .kort.over .kort-status { color: var(--over-line); }
  .kort-meta { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .loest { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0;
    padding: 4px 6px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .loest .boks { width: 34px; height: 34px; border-radius: 10px; border: 2px solid currentColor; display: grid; place-items: center;
    background: var(--card); color: var(--muted); }
  .loest:active .boks { transform: scale(.94); }
  .loest.gjort .boks { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .loest svg { width: 22px; height: 22px; opacity: 0; }
  .loest.gjort svg { opacity: 1; }

  .detaljer { padding: 0 14px 14px; border-top: 1px solid rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) { .detaljer { border-top-color: rgba(255,255,255,.06); } }
  .detaljer .rk { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .detaljer label { font-size: 14px; color: var(--muted); }
  .historik { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; }
  .historik li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .historik li:last-child { border-bottom: 0; }

  .daglig { background: var(--card); border-radius: 12px; padding: 4px 14px; box-shadow: var(--shadow); }
  .daglig div { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .daglig div:last-child { border-bottom: 0; }

  /* Felter og knapper */
  input[type=text], input[type=password], input[type=email], input[type=date], input[type=number], select {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
  input[type=date] { width: auto; }
  .knap { min-height: 44px; padding: 10px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-text);
    font-weight: 600; cursor: pointer; }
  .knap.sekundaer { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .knap.lille { min-height: 34px; padding: 6px 12px; font-size: 14px; }
  .knap.fare { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  .knap:disabled { opacity: .5; }
  .link { background: none; border: 0; color: var(--accent); padding: 4px 0; cursor: pointer; font-size: 15px; }

  /* Login */
  .login { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
  .login h1 { font-size: 34px; margin: 0 0 4px; }
  .login p { color: var(--muted); margin: 0 0 20px; }
  .login form { display: flex; flex-direction: column; gap: 10px; }
  .fejl { color: var(--danger); font-size: 14px; min-height: 20px; }

  /* Rediger */
  .boks-kort { background: var(--card); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
  .ny { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .ny .to { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
  .felt-label { font-size: 12px; color: var(--muted); margin: 0 0 3px 2px; display: block; }
  .rediger-rk { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); display: grid; gap: 8px; }
  .rediger-rk .to { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
  .rediger-rk .bund { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rediger-rk.inaktiv { opacity: .6; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
  .gemt { font-size: 12px; color: var(--accent); min-width: 40px; }
  .mailstatus { font-size: 14px; color: var(--muted); margin-top: 10px; }
  .mailstatus table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .mailstatus td { padding: 4px 0; border-bottom: 1px solid var(--line); }

  /* Fane-bar */
  nav.faner { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.faner button { flex: 1; max-width: 280px; background: none; border: 0; padding: 10px 0 12px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; cursor: pointer; }
  nav.faner button svg { width: 24px; height: 24px; }
  nav.faner button.aktiv { color: var(--accent); font-weight: 600; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom));
    background: #222; color: #fff; padding: 10px 14px; border-radius: 12px; display: flex; gap: 14px; align-items: center;
    font-size: 15px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .toast button { background: none; border: 0; color: #9be39e; font-weight: 700; cursor: pointer; padding: 4px; }
  .tom { color: var(--muted); text-align: center; padding: 24px 0; }
</style>
</head>
<body>

<!-- Login -->
<section id="vLogin" class="login hidden">
  <h1>Pligter</h1>
  <p id="loginTekst">Log ind med din kode.</p>
  <form id="fLogin">
    <input id="lEmail" type="email" autocomplete="username" value="achris@live.dk" readonly>
    <input id="lKode" type="password" autocomplete="current-password" placeholder="Kode" required>
    <input id="lKode2" class="hidden" type="password" autocomplete="new-password" placeholder="Gentag kode">
    <button class="knap" id="lKnap" type="submit">Log ind</button>
    <div class="fejl" id="lFejl"></div>
    <button class="link" type="button" id="lSkift">Første gang? Opret kode</button>
  </form>
</section>

<!-- App -->
<div id="vApp" class="hidden">
  <div class="wrap">
    <header class="top">
      <h1 id="titel">Pligter</h1>
      <span class="dato" id="idag"></span>
    </header>

    <section id="fOpgaver">
      <p class="opsummering" id="opsummering"></p>
      <div class="liste" id="liste"></div>
      <h2>Dagligt</h2>
      <div class="daglig" id="dagligListe"></div>
    </section>

    <section id="fRediger" class="hidden">
      <h2 style="margin-top:8px">Ny opgave</h2>
      <form class="boks-kort ny" id="fNy">
        <div>
          <span class="felt-label">Navn</span>
          <input type="text" id="nNavn" placeholder="Fx Rense filter" required>
        </div>
        <div class="to">
          <div><span class="felt-label">Hvor ofte</span><select id="nFrek"></select></div>
          <div><span class="felt-label">Mail dage før</span><input type="number" id="nVarsel" min="0" max="60" inputmode="numeric"></div>
        </div>
        <button class="knap" type="submit">Tilføj opgave</button>
      </form>

      <div id="redigerGrupper"></div>

      <h2>Mail</h2>
      <div class="boks-kort">
        <p style="margin:0 0 10px;font-size:14px;color:var(--muted)">Mailen sendes hver morgen kl. 7 til achris@live.dk, hvis noget forfalder snart eller er overskredet.</p>
        <button class="knap sekundaer" id="testMail" type="button">Send testmail nu</button>
        <div class="mailstatus" id="mailStatus"></div>
      </div>

      <h2>Konto</h2>
      <div class="boks-kort">
        <button class="knap fare" id="logUd" type="button">Log ud</button>
      </div>
    </section>
  </div>

  <nav class="faner">
    <button id="tOpgaver" class="aktiv" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      Opgaver
    </button>
    <button id="tRediger" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      Rediger
    </button>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
const SB_URL = "https://jmkicrzqmzbetzzjoqtd.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impta2ljcnpxbXpiZXR6empvcXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzY1NDUsImV4cCI6MjEwODExMjU0NX0.BHSSKBFBVZ0qESq-LFkUccpCFRsbhq50DQi4bxK6jx4";
const EJER = "achris@live.dk";

const FREK = [
  ["daglig", "Dagligt"], ["ugentlig", "Ugentligt"], ["14dage", "Hver 14. dag"], ["maanedlig", "Månedligt"],
  ["kvartal", "Kvartalsvis"], ["halvaar", "Halvårligt"], ["aarlig", "Årligt"],
];
const FREK_TEKST = Object.fromEntries(FREK);
const VARSEL = { daglig: 0, ugentlig: 1, "14dage": 2, maanedlig: 7, kvartal: 7, halvaar: 7, aarlig: 7 };
const MDR = ["jan.", "feb.", "mar.", "apr.", "maj", "jun.", "jul.", "aug.", "sep.", "okt.", "nov.", "dec."];
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
let opgaver = [];
let aaben = null;      // id på udvidet kort
let opretTilstand = false;

/* ---------- hjælpere ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDato(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const iAar = new Date().getFullYear();
  return `${d}. ${MDR[m - 1]}` + (y !== iAar ? ` ${y}` : "");
}
function dageTekst(n) { return n === 1 ? "1 dag" : `${n} dage`; }
function idagISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
let toastTimer;
function toast(tekst, fortryd) {
  const t = $("toast");
  t.innerHTML = `<span>${esc(tekst)}</span>` + (fortryd ? '<button type="button">Fortryd</button>' : "");
  t.classList.remove("hidden");
  if (fortryd) t.querySelector("button").onclick = async () => { t.classList.add("hidden"); await fortryd(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hidden"), fortryd ? 6000 : 3000);
}
function fejl(e) { console.error(e); toast("Noget gik galt: " + (e.message || e)); }

/* ---------- farve og status ---------- */
function vurder(o) {
  if (o.sidste_dato == null) return { over: true, hue: 0, status: "Ikke registreret endnu" };
  const d = o.dage_til_forfald;
  if (d < 0) return { over: true, hue: 0, status: `Overskredet ${dageTekst(-d)}` };
  const f = Math.min(1, Math.max(0, 1 - d / Math.max(1, o.interval_dage)));
  const hue = Math.round(120 * (1 - f));
  let status;
  if (d === 0) status = "Forfalder i dag";
  else if (d === 1) status = "Forfalder i morgen";
  else status = `Forfalder om ${dageTekst(d)} · ${fmtDato(o.forfald)}`;
  return { over: false, hue, status };
}
function sortNoegle(o) { return o.sidste_dato == null ? -1e9 : o.dage_til_forfald; }

/* ---------- login ---------- */
function visLogin() {
  $("vApp").classList.add("hidden");
  $("vLogin").classList.remove("hidden");
}
function skiftOpret(on) {
  opretTilstand = on;
  $("lKode2").classList.toggle("hidden", !on);
  $("lKode2").required = on;
  $("lKode").autocomplete = on ? "new-password" : "current-password";
  $("lKnap").textContent = on ? "Opret kode og log ind" : "Log ind";
  $("lSkift").textContent = on ? "Har du en kode? Log ind" : "Første gang? Opret kode";
  $("loginTekst").textContent = on ? "Vælg en kode på mindst 8 tegn." : "Log ind med din kode.";
  $("lFejl").textContent = "";
}
$("lSkift").onclick = () => skiftOpret(!opretTilstand);
$("fLogin").onsubmit = async (e) => {
  e.preventDefault();
  const kode = $("lKode").value;
  $("lFejl").textContent = "";
  $("lKnap").disabled = true;
  try {
    if (opretTilstand) {
      if (kode.length < 8) throw new Error("Koden skal være mindst 8 tegn.");
      if (kode !== $("lKode2").value) throw new Error("De to koder er ikke ens.");
      const res = await fetch(`${SB_URL}/functions/v1/pligter-opsaet`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SB_KEY },
        body: JSON.stringify({ email: EJER, password: kode }),
      });
      const svar = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(svar.fejl || "Kunne ikke oprette koden.");
    }
    const { error } = await sb.auth.signInWithPassword({ email: EJER, password: kode });
    if (error) throw new Error(/invalid/i.test(error.message) ? "Forkert kode. Har du oprettet en kode endnu?" : error.message);
    $("lKode").value = ""; $("lKode2").value = "";
    await visApp();
  } catch (err) {
    $("lFejl").textContent = err.message;
  } finally {
    $("lKnap").disabled = false;
  }
};

/* ---------- app ---------- */
async function visApp() {
  $("vLogin").classList.add("hidden");
  $("vApp").classList.remove("hidden");
  $("idag").textContent = fmtDato(idagISO());
  await hentOpgaver();
}

async function hentOpgaver() {
  const { data, error } = await sb.from("pligt_status").select("*").eq("aktiv", true);
  if (error) return fejl(error);
  opgaver = data || [];
  tegnOpgaver();
}

function tegnOpgaver() {
  const ikkeDaglig = opgaver.filter((o) => o.frekvens !== "daglig")
    .sort((a, b) => sortNoegle(a) - sortNoegle(b) || a.navn.localeCompare(b.navn, "da"));
  const daglig = opgaver.filter((o) => o.frekvens === "daglig")
    .sort((a, b) => a.sortering - b.sortering || a.navn.localeCompare(b.navn, "da"));

  const over = ikkeDaglig.filter((o) => o.sidste_dato == null || o.dage_til_forfald < 0).length;
  const snart = ikkeDaglig.filter((o) => o.sidste_dato != null && o.dage_til_forfald >= 0 && o.dage_til_forfald <= o.varsel_dage).length;
  $("opsummering").innerHTML = over || snart
    ? [over ? `<b>${over}</b> overskredet` : "", snart ? `<b>${snart}</b> forfalder snart` : ""].filter(Boolean).join(" · ")
    : "Alt er under kontrol 🌿";

  $("liste").innerHTML = ikkeDaglig.length ? ikkeDaglig.map((o) => {
    const v = vurder(o);
    const meta = [FREK_TEKST[o.frekvens], o.sidste_dato ? `Sidst ${fmtDato(o.sidste_dato)}` : null].filter(Boolean).join(" · ");
    return `<div class="kort${v.over ? " over" : ""}" style="--h:${v.hue}" data-id="${o.id}">
      <div class="kort-top">
        <div class="kort-tekst" data-handling="udvid">
          <div class="kort-navn">${esc(o.navn)}</div>
          <div class="kort-status">${esc(v.status)}</div>
          <div class="kort-meta">${esc(meta)}</div>
        </div>
        <button class="loest" type="button" data-handling="loest" aria-label="Markér ${esc(o.navn)} som løst">
          <span class="boks">${CHECK}</span>Løst
        </button>
      </div>
      ${aaben === o.id ? `<div class="detaljer" id="det-${o.id}"><div class="rk"><span class="kort-meta">Henter historik …</span></div></div>` : ""}
    </div>`;
  }).join("") : '<div class="tom">Ingen opgaver endnu. Tilføj dem under Rediger.</div>';

  $("dagligListe").innerHTML = daglig.length
    ? daglig.map((o) => `<div>${esc(o.navn)}</div>`).join("")
    : '<div class="kort-meta">Ingen daglige opgaver</div>';

  if (aaben) tegnDetaljer(aaben);
}

$("liste").addEventListener("click", async (e) => {
  const el = e.target.closest("[data-handling]");
  if (!el) return;
  const id = el.closest(".kort").dataset.id;
  const o = opgaver.find((x) => x.id === id);
  if (el.dataset.handling === "udvid") {
    aaben = aaben === id ? null : id;
    tegnOpgaver();
  } else if (el.dataset.handling === "loest") {
    el.classList.add("gjort");
    await markerLoest(o, null);
  }
});

async function markerLoest(o, dato) {
  const raekke = { opgave_id: o.id };
  if (dato) raekke.dato = dato;
  const { data, error } = await sb.from("pligt_udfoert").insert(raekke).select("id, dato").single();
  if (error) return fejl(error);
  if (navigator.vibrate) navigator.vibrate(15);
  await hentOpgaver();
  const naar = data.dato === idagISO() ? "i dag" : fmtDato(data.dato);
  toast(`${o.navn} løst ${naar}`, async () => {
    const { error: e2 } = await sb.from("pligt_udfoert").delete().eq("id", data.id);
    if (e2) return fejl(e2);
    await hentOpgaver();
  });
}

async function tegnDetaljer(id) {
  const boks = $("det-" + id);
  if (!boks) return;
  const o = opgaver.find((x) => x.id === id);
  const { data, error } = await sb.from("pligt_udfoert").select("id, dato").eq("opgave_id", id)
    .order("dato", { ascending: false }).limit(10);
  if (error) return fejl(error);
  if (!$("det-" + id)) return;
  boks.innerHTML = `
    <div class="rk">
      <label for="d-${id}">Løst en anden dag:</label>
      <input type="date" id="d-${id}" max="${idagISO()}" value="${idagISO()}">
      <button class="knap lille" type="button" id="g-${id}">Gem</button>
    </div>
    ${data.length ? `<ul class="historik">${data.map((h) => `<li><span>${fmtDato(h.dato)}</span>
        <button class="knap lille fare" type="button" data-slet="${h.id}">Slet</button></li>`).join("")}</ul>`
      : '<div class="kort-meta" style="margin-top:10px">Ingen historik endnu.</div>'}`;
  $("g-" + id).onclick = () => {
    const v = $("d-" + id).value;
    if (v) markerLoest(o, v);
  };
  boks.querySelectorAll("[data-slet]").forEach((b) => {
    b.onclick = async () => {
      if (b.dataset.klar !== "1") { b.dataset.klar = "1"; b.textContent = "Sikker?"; setTimeout(() => { b.dataset.klar = ""; b.textContent = "Slet"; }, 3000); return; }
      const { error: e2 } = await sb.from("pligt_udfoert").delete().eq("id", b.dataset.slet);
      if (e2) return fejl(e2);
      await hentOpgaver();
    };
  });
}

/* ---------- rediger ---------- */
function frekOptions(valgt) {
  return FREK.map(([k, t]) => `<option value="${k}"${k === valgt ? " selected" : ""}>${t}</option>`).join("");
}
$("nFrek").innerHTML = frekOptions("ugentlig");
$("nVarsel").value = VARSEL.ugentlig;
$("nFrek").onchange = () => { $("nVarsel").value = VARSEL[$("nFrek").value]; };
$("fNy").onsubmit = async (e) => {
  e.preventDefault();
  const navn = $("nNavn").value.trim();
  if (!navn) return;
  const { error } = await sb.from("pligt_opgaver").insert({
    navn, frekvens: $("nFrek").value, varsel_dage: Number($("nVarsel").value || 0), sortering: 999,
  });
  if (error) return fejl(error);
  $("nNavn").value = "";
  toast(`${navn} tilføjet`);
  await tegnRediger();
  await hentOpgaver();
};

async function tegnRediger() {
  const { data, error } = await sb.from("pligt_opgaver").select("*").order("sortering").order("navn");
  if (error) return fejl(error);
  $("redigerGrupper").innerHTML = FREK.map(([k, t]) => {
    const gruppe = data.filter((o) => o.frekvens === k);
    if (!gruppe.length) return "";
    return `<h2>${t}</h2><div class="liste">${gruppe.map((o) => `
      <div class="rediger-rk${o.aktiv ? "" : " inaktiv"}" data-id="${o.id}">
        <input type="text" data-felt="navn" value="${esc(o.navn)}" aria-label="Navn">
        <div class="to">
          <select data-felt="frekvens" aria-label="Hvor ofte">${frekOptions(o.frekvens)}</select>
          <input type="number" min="0" max="60" inputmode="numeric" data-felt="varsel_dage" value="${o.varsel_dage}" aria-label="Mail dage før">
        </div>
        <div class="bund">
          <label class="toggle"><input type="checkbox" data-felt="aktiv"${o.aktiv ? " checked" : ""}> Aktiv</label>
          <span class="gemt"></span>
          <button class="knap lille fare" type="button" data-slet-opgave>Slet</button>
        </div>
      </div>`).join("")}</div>`;
  }).join("");
}

$("redigerGrupper").addEventListener("change", async (e) => {
  const felt = e.target.dataset.felt;
  if (!felt) return;
  const rk = e.target.closest(".rediger-rk");
  let vaerdi = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if (felt === "varsel_dage") vaerdi = Number(vaerdi || 0);
  if (felt === "navn") { vaerdi = vaerdi.trim(); if (!vaerdi) return; }
  const { error } = await sb.from("pligt_opgaver").update({ [felt]: vaerdi }).eq("id", rk.dataset.id);
  if (error) return fejl(error);
  const g = rk.querySelector(".gemt");
  g.textContent = "Gemt ✓";
  setTimeout(() => (g.textContent = ""), 1500);
  if (felt === "aktiv") rk.classList.toggle("inaktiv", !vaerdi);
  if (felt === "frekvens") await tegnRediger();
  await hentOpgaver();
});

$("redigerGrupper").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-slet-opgave]");
  if (!b) return;
  if (b.dataset.klar !== "1") {
    b.dataset.klar = "1"; b.textContent = "Tryk igen for at slette";
    setTimeout(() => { b.dataset.klar = ""; b.textContent = "Slet"; }, 3000);
    return;
  }
  const { error } = await sb.from("pligt_opgaver").delete().eq("id", b.closest(".rediger-rk").dataset.id);
  if (error) return fejl(error);
  await tegnRediger();
  await hentOpgaver();
});

async function tegnMailStatus() {
  const { data, error } = await sb.rpc("pligt_mail_status");
  if (error) { $("mailStatus").textContent = ""; return; }
  $("mailStatus").innerHTML = data && data.length
    ? "Seneste kørsler:<table>" + data.map((r) => `<tr><td>${fmtDato(r.dato)}</td><td>${r.antal} opgaver</td><td>${
        r.antal === 0 ? "ingen mail" : r.http_status ? (r.http_status < 300 ? "sendt ✓" : "fejl " + r.http_status) : "afventer"}</td></tr>`).join("") + "</table>"
    : "Ingen automatiske mails sendt endnu.";
}
$("testMail").onclick = async () => {
  $("testMail").disabled = true;
  const { data, error } = await sb.rpc("pligt_send_testmail");
  $("testMail").disabled = false;
  if (error) return fejl(error);
  toast(data);
};

/* ---------- faner ---------- */
function visFane(navn) {
  const rediger = navn === "rediger";
  $("fOpgaver").classList.toggle("hidden", rediger);
  $("fRediger").classList.toggle("hidden", !rediger);
  $("tOpgaver").classList.toggle("aktiv", !rediger);
  $("tRediger").classList.toggle("aktiv", rediger);
  $("titel").textContent = rediger ? "Rediger" : "Pligter";
  window.scrollTo(0, 0);
  if (rediger) { tegnRediger(); tegnMailStatus(); }
}
$("tOpgaver").onclick = () => visFane("opgaver");
$("tRediger").onclick = () => visFane("rediger");
$("logUd").onclick = async () => { await sb.auth.signOut(); visLogin(); };

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !$("vApp").classList.contains("hidden")) {
    $("idag").textContent = fmtDato(idagISO());
    hentOpgaver();
  }
});

/* ---------- start ---------- */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await visApp(); else visLogin();
})();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
